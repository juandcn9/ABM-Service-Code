name: Governance validation

on:
  push:
    branches: [main, "task-**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate TASK-01 governance and repository safety
        run: python3 scripts/validate_governance.py

  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up the pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Install hash-verified development lock
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Verify the interpreter is the pinned patch version
        run: test "$(python -c 'import platform; print(platform.python_version())')" = "$(cat .python-version)"
      - name: Toolchain pins and locks
        run: python scripts/validate_toolchain.py
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src harness tests scripts
      - name: Tests
        run: pytest -q

  http-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision (PR head, or the pushed commit)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fetch the pinned Specs commit with a read-only deploy key
        env:
          SPECS_DEPLOY_KEY: ${{ secrets.SPECS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SPECS_DEPLOY_KEY" > ~/.ssh/specs_read && chmod 600 ~/.ssh/specs_read
          # host keys are read from GitHub at run time; this runner only, not stored in the repo
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/specs_read -o IdentitiesOnly=yes -l git" \
            git clone --quiet github.com:juandcn9/ABM-Service-Specs.git specs-repo
          git -C specs-repo checkout --quiet --detach 0cca28b2201ae1785044a246c75c37cd655210da
          test "$(git -C specs-repo rev-parse HEAD)" = "0cca28b2201ae1785044a246c75c37cd655210da"
          rm -f ~/.ssh/specs_read
      - name: Set up the pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Install hash-verified development lock
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: HTTP conformance on the same revision (TEST-46, DEC-0056)
        run: python scripts/check_http_conformance.py specs-repo/contracts/openapi.yaml

  container-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - name: Install hash-verified development lock
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Focused tests and their summary (recorded in the manifest)
        run: |
          pytest -q -p no:cacheprovider tests/unit/test_config.py tests/integration/test_container_entry.py tests/integration/test_observability.py > test-run.txt 2>&1
          tail -1 test-run.txt > test-summary.txt
          cat test-run.txt
      - name: Container check (TEST-33, TEST-31 readiness, manifest)
        run: python scripts/check_container.py --test-summary "$(cat test-summary.txt)"
      - name: Black-box HTTP smoke check of the running image (TASK-36, DEC-0067)
        run: python scripts/smoke_container.py
